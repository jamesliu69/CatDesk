name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - windows-2022

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy

      - name: Install Bubblewrap
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Check formatting
        if: runner.os == 'Linux'
        run: cargo +stable fmt --check

      - name: Run release tests
        run: cargo +stable test --release --locked

      - name: Run Clippy
        if: runner.os == 'Linux'
        run: cargo +stable clippy --all-targets --locked

      - name: Build release binary
        run: cargo +stable build --release --locked
